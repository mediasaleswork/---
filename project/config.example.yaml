# Копируйте в config.yaml. ID закрытой рабочей группы можно узнать командой dialogs.
source_group: ""
# Признаки берутся из каждой заявки. Эти списки — необязательный общий резерв.
keywords: []
domains: []
timezone: Asia/Tashkent
interval_seconds: 300
# Быстрые обновления публичных каналов без вступления: максимум 10, 0 отключает.
# Остальные каналы проверяются по interval_seconds.
realtime_channel_limit: 10
# Первый запуск: искать сообщения группы и новых каналов за последние 7 дней.
lookback_days: 7
# Порция истории за цикл; при большой очереди следующие порции будут прочитаны позже.
batch_size: 200
# Если дата публикации не указана: искать 7 дней от времени сообщения группы.
# Длительность нахождения рекламы в канале задаётся отдельно в заявке.
default_window_days: 7
milestones_hours: [24, 48]
# Онлайн-синхронизация включается отдельно командой sync-google.
spreadsheet_id: ""
google_credentials: ""
drive_folder_id: ""
