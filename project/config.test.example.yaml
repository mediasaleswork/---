# Copy outside Git as config.test.yaml. No credentials belong in this file.
source_group: ""
test_mode: true
conversation_mode: true
data_namespace: test
allowed_channels: [your_test_channel]
default_client: Тестовый клиент
channel_plans:
  - contract: test-contract
    client: Тестовый клиент
    channel: your_test_channel
    title: Тестовый канал
    aliases: [Тестовый канал]
    language: UZ
    planned_posts: 3
keywords: []
domains: []
timezone: Asia/Tashkent
interval_seconds: 300
google_sync_interval_seconds: 900
milestones_hours: [24, 48]
spreadsheet_id: ""
google_credentials: ""
drive_folder_id: ""

# Optional Gemini free-tier vision/semantic matching. Key only in GEMINI_API_KEY.
# Enable after verifying the Google project is Free tier, with no billing linked.
campaign_matching: false
campaign_provider: gemini
campaign_model: gemini-3.1-flash-lite
campaign_daily_limit: 8
campaign_total_limit: 8
campaign_batch_size: 2
# Folder metadata only in test mode; test whitelist remains unchanged.
channel_folder: ""
channel_folder_watch: false
